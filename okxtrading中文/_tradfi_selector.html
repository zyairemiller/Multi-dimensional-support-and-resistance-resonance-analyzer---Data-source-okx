<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TradFi 品种选择器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ====== 顶部栏 ====== */
.topbar{background:#161b22;border-bottom:1px solid #21262d;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.topbar h1{font-size:15px;font-weight:600;white-space:nowrap}
.topbar .desc{font-size:11px;color:#6b7280;margin-left:4px}

.back-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:6px;
  border:1px solid #30363d;background:#21262d;
  color:#8b949e;cursor:pointer;font-size:12px;
  transition:.12s;white-space:nowrap;margin-right:8px;
}
.back-btn:hover{border-color:#8b949e;color:#c9d1d9}
.back-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;flex-shrink:0}

#search{background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:6px 12px;border-radius:6px;width:200px;font-size:13px;outline:none}
#search:focus{border-color:#58a6ff}
#search::placeholder{color:#484f58}

.tabs{display:flex;gap:4px}
.tab{padding:5px 12px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-size:12px;transition:.12s}
.tab:hover{border-color:#58a6ff;color:#c9d1d9}
.tab.active{background:#1f6feb;border-color:#388bfd;color:#fff}
.tab .count{font-size:10px;opacity:.6}

.actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.actions .hint{font-size:11px;color:#6b7280}

/* ====== 主区域 ====== */
.main{display:flex;flex:1;overflow:hidden}

/* 品种列表 */
.grid{flex:1;overflow-y:auto;padding:6px}
.row{display:flex;align-items:center;padding:5px 10px;border-radius:5px;cursor:pointer;gap:8px;transition:background .08s;margin-bottom:1px;user-select:none}
.row:hover{background:#1c2129}
.row.selected{background:#0d419d}
.row input[type=checkbox]{accent-color:#1f6feb;cursor:pointer;flex-shrink:0;width:14px;height:14px}
.row .base{font-size:13px;font-weight:600;min-width:60px}
.row .full-id{font-size:11px;color:#6b7280;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.row .tag.swap{background:#122416;color:#3fb950;border:1px solid #1a3a1a}
.row .tag.spot{background:#121a2a;color:#58a6ff;border:1px solid #1a2a4a}
.empty{text-align:center;padding:80px 20px;color:#484f58;font-size:14px}

/* 侧边栏 */
.sidebar{width:280px;border-left:1px solid #21262d;display:flex;flex-direction:column;flex-shrink:0;background:#0d1117}
.sidebar-top{padding:16px;border-bottom:1px solid #21262d}
.sidebar-mid{padding:16px;flex:1}
.sidebar-bot{padding:16px;border-top:1px solid #21262d}

.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stat-row .label{font-size:12px;color:#8b949e}
.stat-row .value{font-size:15px;font-weight:700}
.stat-row .unit{font-size:11px;color:#6b7280;margin-left:2px}

#start-btn{width:100%;padding:12px;border-radius:8px;border:none;background:#238636;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.12s;margin-top:4px}
#start-btn:disabled{background:#21262d;color:#484f58;cursor:not-allowed}
#start-btn:not(:disabled):hover{background:#2ea043}

.est-row{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-top:8px}
.est-row span:last-child{color:#8b949e}

/* 进度区 */
.progress-box{display:none}
.progress-box.show{display:block}
.progress-bar{height:4px;background:#1e2738;border-radius:2px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#3fb950);width:0;transition:width .4s ease;border-radius:2px}
.progress-text{font-size:12px;color:#8b949e;min-height:16px}
.progress-sub{font-size:10px;color:#6b7280}

/* prompt */
.prompt{font-size:11px;color:#484f58;padding:8px 0;line-height:1.6}
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="location.href='/'" title="返回主界面">
    <svg viewBox="0 0 16 16"><path d="M10.5 3L5.5 8l5 5"/></svg>
    <span>返回</span>
  </button>
  <h1>TradFi 品种选择器</h1>
  <span class="desc">OKX 全品种</span>
  <input id="search" placeholder="搜索品种..." oninput="applyFilters()">
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all" onclick="setFilter('all',this)">全部 <span class="count"></span></button>
    <button class="tab" data-filter="swap" onclick="setFilter('swap',this)">永续 <span class="count"></span></button>
    <button class="tab" data-filter="spot" onclick="setFilter('spot',this)">现货 <span class="count"></span></button>
  </div>
  <div class="actions">
    <span class="hint" id="visible-count">636 品种</span>
  </div>
</div>

<div class="main">
  <div class="grid" id="grid">
    <div class="empty">加载品种列表中...</div>
  </div>

  <div class="sidebar">
    <div class="sidebar-top">
      <div class="stat-row">
        <span class="label">已选品种</span>
        <span><span class="value" id="sel-num">0</span><span class="unit">个</span></span>
      </div>
      <div class="stat-row" style="margin-bottom:2px">
        <span class="label">预计 K 线量</span>
        <span><span class="value" id="est-candles">0</span><span class="unit">根</span></span>
      </div>
      <div class="est-row">
        <span>预估耗时</span>
        <span id="est-time">—</span>
      </div>
      <button id="start-btn" disabled onclick="startAnalysis()">开始分析</button>
    </div>

    <div class="sidebar-mid">
      <div class="prompt">
        <div style="margin-bottom:4px">提示</div>
        · 搜索支持品种代码前缀匹配<br>
        · 建议首次选择 3-5 个品种测试<br>
        · 分析完成后可切换品种重新选择
      </div>
    </div>

    <div class="sidebar-bot">
      <div class="progress-box" id="progress-box">
        <div class="progress-text" id="prog-msg"></div>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
        <div class="progress-sub" id="prog-sub"></div>
      </div>
    </div>
  </div>
</div>

<script>
const CANDLES_PER = 11315;  // 8760(1H) + 2190(4H) + 365(1D)
let allInstruments = [];
let selected = new Set();
let currentFilter = 'all';

// ====== 加载品种列表 ======
fetch('/api/tradfi_instruments')
  .then(r => r.json())
  .then(data => {
    allInstruments = data;
    updateTabCounts();
    applyFilters();
  })
  .catch(() => {
    document.getElementById('grid').innerHTML = 
      '<div class="empty">无法加载品种列表，请检查网络后刷新页面</div>';
  });

function updateTabCounts() {
  let sw = allInstruments.filter(d => d.instId.endsWith('-SWAP')).length;
  let sp = allInstruments.length - sw;
  document.querySelectorAll('.tab').forEach(t => {
    let f = t.dataset.filter;
    t.querySelector('.count').textContent = 
      f === 'all' ? `(${allInstruments.length})` :
      f === 'swap' ? `(${sw})` : `(${sp})`;
  });
}

// ====== 过滤 & 渲染 ======
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  let q = document.getElementById('search').value.toLowerCase();
  let filtered = allInstruments.filter(d => {
    if (currentFilter === 'swap' && !d.instId.endsWith('-SWAP')) return false;
    if (currentFilter === 'spot' && d.instId.endsWith('-SWAP')) return false;
    if (!q) return true;
    let base = (d.baseCcy || '').toLowerCase();
    return base.startsWith(q) || d.instId.toLowerCase().includes(q);
  });

  document.getElementById('visible-count').textContent = 
    '显示 ' + filtered.length + ' / ' + allInstruments.length + ' 品种';

  let html = '';
  if (filtered.length === 0) {
    html = '<div class="empty">无匹配品种</div>';
  } else {
    filtered.forEach(d => {
      let isSwap = d.instId.endsWith('-SWAP');
      let base = d.baseCcy || d.instId.split('-')[0];
      let sel = selected.has(d.instId);
      html += '<div class="row' + (sel ? ' selected' : '') + '" onclick="toggle(\'' + d.instId + '\',this)">';
      html += '<input type="checkbox" ' + (sel ? 'checked' : '') + ' tabindex="-1">';
      html += '<span class="base">' + base + '</span>';
      html += '<span class="full-id">' + d.instId + '</span>';
      html += '<span class="tag ' + (isSwap ? 'swap' : 'spot') + '">' + (isSwap ? '永续' : '现货') + '</span>';
      html += '</div>';
    });
  }
  document.getElementById('grid').innerHTML = html;
}

// ====== 选择 ======
function toggle(instId, el) {
  if (selected.has(instId)) {
    selected.delete(instId);
    if (el) { el.classList.remove('selected'); el.querySelector('input').checked = false; }
  } else {
    selected.add(instId);
    if (el) { el.classList.add('selected'); el.querySelector('input').checked = true; }
  }
  updateStats();
}

function updateStats() {
  let n = selected.size;
  document.getElementById('sel-num').textContent = n;
  let candles = n * CANDLES_PER;
  document.getElementById('est-candles').textContent = candles.toLocaleString();
  
  // 预估时间：每品种 ~40 次 API 调用，限速 10/s + 计算时间
  let estSec = n * 6;  // 约 6 秒/品种（含 API + 计算 + 渲染）
  if (n === 0) {
    document.getElementById('est-time').textContent = '—';
  } else if (estSec < 60) {
    document.getElementById('est-time').textContent = '约 ' + Math.ceil(estSec) + ' 秒';
  } else {
    document.getElementById('est-time').textContent = '约 ' + (estSec/60).toFixed(1) + ' 分钟';
  }
  
  document.getElementById('start-btn').disabled = n === 0;
}

// ====== 开始分析 ======
function startAnalysis() {
  if (selected.size === 0) return;
  
  // 禁用 UI
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').textContent = '分析中...';
  document.getElementById('progress-box').classList.add('show');
  document.getElementById('prog-fill').style.background = '';
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('prog-msg').textContent = '正在准备...';
  document.getElementById('prog-sub').textContent = '';
  
  let instIds = Array.from(selected);
  let startTs = Date.now();
  let timeoutSec = Math.max(90, instIds.length * 45);
  
  fetch('/api/tradfi_start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({inst_ids: instIds})
  }).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(d => {
    // 轮询进度
    let timer = setInterval(() => {
      let elapsed = (Date.now() - startTs) / 1000;
      if (elapsed > timeoutSec) {
        clearInterval(timer);
        document.getElementById('prog-msg').textContent = '分析超时（' + timeoutSec + '秒），请重试';
        document.getElementById('prog-sub').textContent = '服务器可能负载过高';
        document.getElementById('start-btn').disabled = false;
        document.getElementById('start-btn').textContent = '重试';
        return;
      }
      
      fetch('/api/tradfi_progress').then(r => r.json()).then(p => {
        document.getElementById('prog-fill').style.width = p.pct + '%';
        document.getElementById('prog-msg').textContent = p.msg || '';
        let total = instIds.length;
        let done = Math.round(p.pct * total / 100);
        document.getElementById('prog-sub').textContent = 
          p.pct > 0 ? done + '/' + total + ' 品种' : '';
        
        if (p.done) {
          clearInterval(timer);
          document.getElementById('prog-fill').style.background = '#3fb950';
          if (p.report_url) {
            document.getElementById('prog-sub').textContent = '分析完成，正在跳转报告...';
            setTimeout(() => { window.location.href = p.report_url; }, 800);
          } else {
            document.getElementById('prog-msg').textContent = '分析失败：未生成报告';
            document.getElementById('prog-sub').textContent = '请检查网络后重试';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = '重试';
          }
        }
      }).catch(() => {});
    }, 500);
  }).catch(e => {
    document.getElementById('prog-msg').textContent = '启动失败: ' + e.message;
    document.getElementById('prog-sub').textContent = '请检查服务是否运行';
    document.getElementById('start-btn').disabled = false;
    document.getElementById('start-btn').textContent = '重试';
  });
}
</script>
</body>
</html>
